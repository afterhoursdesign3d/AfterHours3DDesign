# Rebuilds the design and service pages whenever you push, then saves the result back to the repo.
# Cloudflare then publishes the new commit. Nothing to set up on Cloudflare.
name: Build pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.js
      - name: Save rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Rebuild pages from data files"
          git push
