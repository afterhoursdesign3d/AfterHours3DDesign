<main id="main">
<section class="container split page-head contact-split"><div class="contact-intro"><h1>Contact us</h1>
<div class="contact-copy"><p>Have an idea, a need for our services, or a general query? Get in touch, we would love to hear from you.</p>

<form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
<!-- ================================================= -->
<!-- PASTE YOUR WEB3FORMS ACCESS KEY ON THE LINE BELOW -->
<!-- ================================================= -->
<input type="hidden" name="access_key" value="PASTE_YOUR_WEB3FORMS_ACCESS_KEY_HERE">
<input type="hidden" name="from_name" value="After Hours 3D Design website">
<input type="hidden" name="subject" value="New message from the website">
<input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
<label>Name *<input name="name" required></label>
<label>Email *<input type="email" name="email" required></label>
<label>Subject<input name="user_subject"></label>
<label>Message *<textarea name="message" rows="6" required></textarea></label>
<div class="form-actions"><button class="btn" type="submit">Send message</button><!-- EDIT: email address --><a data-email href="mailto:">email</a></div>
