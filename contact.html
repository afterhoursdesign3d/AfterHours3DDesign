<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | After Hours Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Rubik:wght@600;800&display=swap" rel="stylesheet">
<!-- EDIT: favicon files live in /assets (favicon.svg adapts to light and dark mode). Change the ?v= number to force browsers to reload it -->
<link rel="icon" href="favicon.ico?v=3" sizes="32x32"><link rel="icon" href="assets/favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=3"><link rel="stylesheet" href="css/style.css"></head>
<body data-header="hide-on-scroll" data-footer="no-follow">
<a class="skip" href="#main">Skip to content</a>
<script src="js/layout.js"></script><script>writeHeader();</script>
<main id="main">
<section class="container split page-head contact-split"><div class="contact-intro"><h1>Contact us</h1>
<p class="lead">Have an idea, a need for our services, or a general query? Get in touch, we would love to hear from you. If you haven't had a reply after two business days, please assume the form isn't working and email us directly.</p>
</div>
<form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
<!-- ================================================= -->
<!-- PASTE YOUR WEB3FORMS ACCESS KEY ON THE LINE BELOW -->
<!-- ================================================= -->
<input type="hidden" name="access_key" value="PASTE_YOUR_WEB3FORMS_ACCESS_KEY_HERE">
<input type="hidden" name="from_name" value="After Hours Design website">
<input type="hidden" name="subject" value="New message from the website">
<input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
<label>Name *<input name="name" required></label>
<label>Email *<input type="email" name="email" required></label>
<label>Subject<input name="user_subject"></label>
<label>Message *<textarea name="message" rows="6" required></textarea></label>
<div class="form-actions"><button class="btn" type="submit">Send message</button><!-- EDIT: email address --><a data-email href="mailto:">email</a></div>
<p id="form-status" role="status" aria-live="polite"></p></form></section>
</main>
<script>writeFooter();</script>
<script src="js/main.js"></script>
</body></html>
